services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: powerbi_agent
      POSTGRES_USER: powerbi_agent
      POSTGRES_PASSWORD: powerbi_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerbi_agent -d powerbi_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
